# A permanent database on this computer. No Docker or database server required.
spring:
  datasource:
    url: jdbc:h2:file:${LOCAL_DB_PATH:./data/marble};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 10000
  jdbc:
    template:
      query-timeout: 30s
app:
  jwt:
    secret: ${APP_JWT_SECRET}
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD}
  demo:
    enabled: false
  local:
    backup-directory: ./data/backups
server:
  address: 127.0.0.1
