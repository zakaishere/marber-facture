spring:
  application:
    name: marble-invoicing
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/marble_invoicing}
    username: ${DB_USERNAME:marble}
    password: ${DB_PASSWORD:marble_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:4000}
app:
  jwt:
    secret: ${APP_JWT_SECRET:local-marble-development-key-change-before-sharing-2026}
    expiration-ms: 604800000
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:marble123}
  demo:
    enabled: ${APP_DEMO_ENABLED:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173,http://127.0.0.1:8080,http://127.0.0.1:5173}

